<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadbeacon has moved</title>
<link rel="canonical" href="https://cypherpunk.today/roadbeacon/">
<meta http-equiv="refresh" content="2; url=https://cypherpunk.today/roadbeacon/">
<script>
  // Keep path, query and hash; works for every language folder and deep link.
  (function () {
    var base = '/roadbeacon/';
    var p = location.pathname;
    var rest = p.indexOf(base) === 0 ? p.slice(base.length) : '';
    if (rest === '404.html') rest = '';
    location.replace('https://cypherpunk.today/roadbeacon/' + rest + location.search + location.hash);
  })();
</script>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 16px}</style>
</head>
<body>
<h1>Roadbeacon has moved</h1>
<p>The site is now at <a href="https://cypherpunk.today/roadbeacon/">cypherpunk.today/roadbeacon</a>.</p>
<noscript><p>Please follow the link above.</p></noscript>
</body>
</html>
